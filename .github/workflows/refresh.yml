name: Refresh market data

on:
  schedule:
    - cron: "30 19 * * *"   # 19:30 UTC = 1:00 am IST, every day
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Refresh numbers
        run: uv run refresh.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.js live.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh market data ($(date -u +%F))"
            git push
            # pushes made by the Actions token don't always trigger a Pages rebuild, so ask for one
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}
